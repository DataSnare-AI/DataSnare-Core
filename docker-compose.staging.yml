services:
  core-api:
    build:
      context: .
      target: api
    environment:
      DATASNARE_ENV: ${DATASNARE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-8}
      DB_COMMAND_TIMEOUT_SECONDS: ${DB_COMMAND_TIMEOUT_SECONDS:-60}
      CORE_STORAGE_ENCRYPTION_KEY: ${CORE_STORAGE_ENCRYPTION_KEY:-}
    volumes:
      - core_artifacts:/var/lib/datasnare-core/artifacts
    expose:
      - "8000"
    networks:
      edge:
        aliases:
          - datasnare-core-api
    restart: unless-stopped

  core-web:
    build:
      context: .
      target: web
    environment:
      CORE_APP_DOMAIN: ${CORE_APP_DOMAIN:-staging.app.datasnare.com}
      CORE_API_DOMAIN: ${CORE_API_DOMAIN:-staging.api.datasnare.com}
    depends_on:
      - core-api
    expose:
      - "80"
    networks:
      edge:
        aliases:
          - datasnare-core-web
    restart: unless-stopped

networks:
  edge:
    external: true
    name: ${CORE_EDGE_NETWORK:?Set CORE_EDGE_NETWORK to the existing AIOps/Caddy Docker network}

volumes:
  core_artifacts: